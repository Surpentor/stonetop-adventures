name: Rename deploy 11 to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with deploy 11 build
        run: |
          rm index.html
          mv stonetop-adventures.html index.html
      - name: Commit and push
        run: |
          git config user.name "Surpentor"
          git config user.email "mjpisani@gmail.com"
          git add -A
          git commit -m "Deploy #11: rename stonetop-adventures.html to index.html"
          git push
